[package]
name = "lsp-gateway"
version = "0.1.0"
edition = "2021"
authors = ["ivloli"]
description = "A high-performance LLM gateway with intelligent provider routing and adaptive traffic control"
license = "MIT"
repository = "https://github.com/ivloli/lsp-gateway"
readme = "README.md"
keywords = ["llm", "gateway", "routing", "openai", "proxy"]
categories = ["web-programming::http-server"]
publish = false

[[bin]]
name = "lsp-gateway"
path = "src/main.rs"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tokio = { version = "1.47", features = ["full"] }
axum = "0.8.5"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
moka = { version = "0.12", features = ["future"] }
dotenvy = "0.15"
hostname = "0.3"
local-ip-address = "0.1"
bytes = "1.10"
metrics = "0.21"
prometheus = "0.13"

# Pin base64ct to avoid edition2024 requirement
base64ct = "=1.6.0"
once_cell = "1.21.3"
async-trait = "0.1"
minijinja = "2.12.0"
parking_lot = "0.12"
regex = "1.11"
simd-json = "0.13"
memchr = "2.7"

# OpenTelemetry 追踪支持 (使用最新稳定版本)
# 注意：添加了 "trace" feature 到 opentelemetry_sdk 以确保完整的追踪功能
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client", "grpc-tonic"] }
opentelemetry-http = "0.27"
tracing-opentelemetry = "0.28"

# Optional profiling dependencies
pprof = { version = "0.15", features = ["flamegraph", "protobuf-codec"], optional = true }

[features]
# Enable CPU profiling endpoints
profiling = ["pprof"]

[profile.release]
# 保持优化的同时添加调试符号，用于 profiling
debug = true  # 或使用 debug = 1 (line tables only) 或 debug = 2 (full debug info)
# 保留 frame pointers 以便 profiling 工具能正确回溯调用栈
# 这对 pprof 等工具至关重要
strip = false  # 不要剥离符号

[profile.dev]
# 开发模式也启用 frame pointers
# 这样在开发时也能进行 profiling
